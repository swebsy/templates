            ? mode

            return normalize(
              window.localStorage && window.localStorage.getItem(storageKey)
            );
          } catch (_) {

        }
        var resolved = resolve(readStoredMode() || defaultMode);
        root.classList.remove("light", "dark");
        root.classList.add(resolved);
        root.style.colorScheme = resolved;
